name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer run of the same workflow on the same ref replaces the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, and no secrets are used: pull requests from forks run this workflow as well.
permissions:
  contents: read

defaults:
  run:
    working-directory: bewerbung-studio

jobs:
  check:
    # The name is the status check to require for `main` (Settings → Branches / Rulesets).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests and the production build never start Electron, so its binary is not downloaded.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bewerbung-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # release:check is the one source of truth: typecheck → tests → production build.
      - name: Quality gate (typecheck, tests, production build)
        run: npm run release:check
